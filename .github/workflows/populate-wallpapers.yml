name: Populate Fenrir Wallpapers Volume 03

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/populate-wallpapers.yml"
      - "tools/populate_commons_wallpapers.py"
  schedule:
    - cron: "17 0,12 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: fenrir-wallpaper-population-volume-03
  cancel-in-progress: true

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Cancel stale queued and running acquisition jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${REPOSITORY}/actions/runs?per_page=100")"
          stale_ids="$(printf '%s' "$runs" | jq -r --arg current "$CURRENT_RUN_ID" '
            .workflow_runs[]
            | select((.id | tostring) != $current)
            | select(.path == ".github/workflows/populate-wallpapers.yml")
            | select(.status as $s | ["queued","in_progress","pending","requested","waiting"] | index($s))
            | .id
          ')"
          if [ -n "$stale_ids" ]; then
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Cancelling stale acquisition run $run_id"
              if ! gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1; then
                gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null
              fi
            done <<< "$stale_ids"
          else
            echo "No stale acquisition runs to cancel."
          fi
          for attempt in 1 2 3 4 5; do
            active="$(gh api "repos/${REPOSITORY}/actions/runs?per_page=100" | jq --arg current "$CURRENT_RUN_ID" '
              [.workflow_runs[]
               | select((.id | tostring) != $current)
               | select(.path == ".github/workflows/populate-wallpapers.yml")
               | select(.status as $s | ["queued","in_progress","pending","requested","waiting"] | index($s))]
              | length
            ')"
            [ "$active" -eq 0 ] && break
            sleep 3
          done
          if [ "$active" -ne 0 ]; then
            echo "Stale acquisition runs remain active: $active"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check Volume 02 coordinator is idle
        id: volume02_gate
        shell: bash
        run: |
          set -euo pipefail
          runs="$(curl -fsS -H "Accept: application/vnd.github+json" 'https://api.github.com/repos/sunxsaturn/Fenrir-Wallpapers-02/actions/runs?per_page=30')"
          active="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.name == "Populate Fenrir Wallpapers Volume 02" and (.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "requested" or .status == "waiting"))] | length')"
          if [ "$active" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Volume 02 is active or queued; Volume 03 will skip this slot."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Volume 02 is idle; Volume 03 may acquire."
          fi
      - name: Validate importer syntax
        run: python -m py_compile tools/populate_commons_wallpapers.py
      - name: Reset saved search queues without touching wallpaper files
        if: steps.volume02_gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("manifest/index.json")
          index = json.loads(path.read_text(encoding="utf-8"))
          index["search_state"] = {}
          path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Reset search cursors; preserved all committed image records.")
          PY
      - name: Fill all folders in sequential bounded batches
        if: steps.volume02_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          max_batches=24
          consecutive_empty_batches=0
          max_consecutive_empty_batches=3
          for ((batch=1; batch<=max_batches; batch++)); do
            echo "Starting Volume 03 acquisition batch ${batch}/${max_batches}"
            report_file="$RUNNER_TEMP/fenrir-volume-03-batch-${batch}.json"

            python tools/populate_commons_wallpapers.py --max-new-images 80 | tee "$report_file"

            git add "Fenrir Wallpapers" manifest/index.json
            if git diff --cached --quiet; then
              echo "No new files or cursor updates; stopping the coordinator."
              break
            fi

            new_images="$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1], encoding="utf-8")).get("new_images", 0)) if "new_images" in json.load(open(sys.argv[1], encoding="utf-8")) else 0)' "$report_file")"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: add verified wallpapers to Volume 03 (batch ${batch})"

            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((attempt * 20))
            done
            if [ "$pushed" != true ]; then
              echo "Unable to push batch ${batch} after five attempts."
              exit 1
            fi

            echo "Committed batch ${batch}: ${new_images} new wallpapers."
            if [ "$new_images" -eq 0 ]; then
              consecutive_empty_batches=$((consecutive_empty_batches + 1))
              echo "No eligible image in slice; saved search cursors. Consecutive empty slices: ${consecutive_empty_batches}/${max_consecutive_empty_batches}."
              if [ "$consecutive_empty_batches" -ge "$max_consecutive_empty_batches" ]; then
                echo "Three consecutive empty slices; stopping this run while preserving every saved cursor."
                break
              fi
            else
              consecutive_empty_batches=0
            fi
          done
      - name: Report final manifest count
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path("manifest/index.json").read_text(encoding="utf-8"))
          print(json.dumps({"count": index.get("count", 0), "updated_at": index.get("updated_at")}, indent=2))
          PY
