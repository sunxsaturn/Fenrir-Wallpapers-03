name: Populate Fenrir Wallpapers Volume 03

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/populate-wallpapers.yml"
      - "tools/populate_commons_wallpapers.py"
      - "manifest/index.json"
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: fenrir-wallpaper-population-volume-03
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Acquire globally unique, licensed wallpapers
        run: python tools/populate_commons_wallpapers.py --max-new-images 80
      - name: Commit and push verified images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Fenrir Wallpapers" manifest/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add verified wallpapers to Volume 03"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git rebase origin/main
            sleep $((attempt * 15))
          done
          exit 1
