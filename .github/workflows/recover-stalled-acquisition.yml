name: Recover Volume 03 acquisition coordinator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-stalled-acquisition.yml"

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale acquisition runs and dispatch current coordinator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPOSITORY}"

          for run_id in 45922186099 45922866648; do
            code="$(curl -sS -o "$RUNNER_TEMP/cancel-${run_id}.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/runs/${run_id}/cancel")"
            echo "Cancel request for run ${run_id}: HTTP ${code}"
            case "$code" in
              202|204|404|409|422) ;;
              *) cat "$RUNNER_TEMP/cancel-${run_id}.json"; exit 1 ;;
            esac
          done

          for attempt in $(seq 1 30); do
            still_active=0
            for run_id in 45922186099 45922866648; do
              status="$(curl -fsS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api}/actions/runs/${run_id}" | jq -r '.status')"
              if [ "$status" != "completed" ]; then
                still_active=1
              fi
            done
            if [ "$still_active" -eq 0 ]; then
              break
            fi
            sleep 2
          done

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/populate-wallpapers.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Dispatched the current Volume 03 multi-batch coordinator."
